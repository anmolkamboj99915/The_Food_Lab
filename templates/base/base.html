{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Food Lab CRM{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'css/crm.css' %}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark crm-navbar">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'customers:dashboard' %}">Food Lab CRM</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <div class="navbar-nav ms-auto gap-lg-2">
                    <a class="nav-link" href="{% url 'customers:dashboard' %}">Dashboard</a>
                    <a class="nav-link" href="{% url 'customers:create' %}">Add Customer</a>
                    <a class="nav-link" href="{% url 'customers:list' %}">Customer List</a>
                    <a class="nav-link" href="{% url 'customers:export' %}">Export Excel</a>
                    <a class="nav-link" href="/admin/">Admin</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="crm-page">
        <div class="container py-4 py-lg-5">
            {% if messages %}
                <div class="mb-4">
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
            {% block content %}{% endblock %}
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
