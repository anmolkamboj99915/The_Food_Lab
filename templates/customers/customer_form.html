{% extends 'base/base.html' %}
{% block title %}{{ title }} | Food Lab CRM{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <section class="crm-panel">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h1 class="h4 fw-bold mb-0">{{ title }}</h1>
                <a class="btn btn-outline-secondary btn-sm" href="{% url 'customers:list' %}">Customer List</a>
            </div>
            <form method="post" novalidate>
                {% include 'customers/_customer_form_fields.html' %}
                <div class="d-flex gap-2 mt-4">
                    <button class="btn btn-primary" type="submit">Save Customer</button>
                    {% if customer %}
                        <a class="btn btn-outline-secondary" href="{{ customer.get_absolute_url }}">Cancel</a>
                    {% else %}
                        <a class="btn btn-outline-secondary" href="{% url 'customers:dashboard' %}">Cancel</a>
                    {% endif %}
                </div>
            </form>
        </section>
    </div>
</div>
{% endblock %}
