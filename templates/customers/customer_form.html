{% extends 'base/base.html' %}
{% block title %}{{ title }} | Food Lab CRM{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-9">
        <section class="crm-panel">
            <div class="d-flex flex-column flex-md-row justify-content-between gap-2 mb-3">
                <div>
                    <p class="page-kicker mb-1">Customer Profile</p>
                    <h1 class="h4 fw-bold mb-0">{{ title }}</h1>
                </div>
                <a class="btn btn-outline-secondary btn-sm align-self-start" href="{% url 'customers:list' %}"><i class="bi bi-people"></i> Customer List</a>
            </div>
            <form method="post" novalidate>
                {% include 'customers/_customer_form_fields.html' %}
                <div class="d-flex gap-2 mt-4">
                    <button class="btn btn-primary" type="submit"><i class="bi bi-check2-circle"></i> Save Customer</button>
                    {% if customer %}
                        <a class="btn btn-outline-secondary" href="{{ customer.get_absolute_url }}">Cancel</a>
                    {% else %}
                        <a class="btn btn-outline-secondary" href="{% url 'customers:dashboard' %}">Cancel</a>
                    {% endif %}
                </div>
            </form>
        </section>
    </div>
</div>
{% endblock %}
