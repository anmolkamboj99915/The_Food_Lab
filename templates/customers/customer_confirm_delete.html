{% extends 'base/base.html' %}
{% block title %}Delete {{ customer.name }} | Food Lab CRM{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <section class="crm-panel">
            <h1 class="h4 fw-bold mb-3">Delete Customer</h1>
            <p>Are you sure you want to delete <strong>{{ customer.name }}</strong>? This action cannot be undone.</p>
            <form method="post">
                {% csrf_token %}
                <div class="d-flex gap-2">
                    <button class="btn btn-danger" type="submit">Delete</button>
                    <a class="btn btn-outline-secondary" href="{{ customer.get_absolute_url }}">Cancel</a>
                </div>
            </form>
        </section>
    </div>
</div>
{% endblock %}
